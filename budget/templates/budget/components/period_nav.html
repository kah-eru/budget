{# The range bar, centered over the chart on the Overview, the Timeline and the Savings page: range_nav from views.range_nav(). #}
<nav aria-label="Period" class="mx-auto flex w-fit items-center gap-0.5">
  {% if range_nav.prev %}<a class="range-arrow" href="{{ range_nav.prev }}" aria-label="Previous {{ range_nav.kind }}">←</a>{% endif %}
  <div class="flex gap-0.5 rounded-full bg-sunken p-0.5">
    {% for label, href, current in range_nav.items %}<a class="segment whitespace-nowrap px-2.5 py-0.5 text-xs" href="{{ href }}" {% if current %}aria-current="page"{% endif %}>{{ label }}</a>{% endfor %}
  </div>
  {% if range_nav.next %}<a class="range-arrow" href="{{ range_nav.next }}" aria-label="Next {{ range_nav.kind }}">→</a>{% endif %}
</nav>
