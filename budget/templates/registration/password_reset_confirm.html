{% extends 'budget/base.html' %}
{% block content %}
<section class="mx-auto max-w-md card">
  <h1 class="mb-4 text-3xl">Set a new password</h1>
  {% if validlink %}
  <form method="post">{% csrf_token %}{% include 'budget/components/form_fields.html' %}<button class="primary" type="submit">Save password</button></form>
  {% else %}
  <p class="mb-4">This recovery link is invalid or expired.</p><a class="secondary" href="{% url 'password_reset' %}">Request another link</a>
  {% endif %}
</section>
{% endblock %}
