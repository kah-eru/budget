{% extends 'budget/base.html' %}
{% block content %}
<section class="mx-auto max-w-md card p-6">
  <h1 class="mb-3 text-3xl">Recover your account</h1>
  <p class="mb-5 text-muted">Enter your verified email address. Accounts without a verified email need help from the operator.</p>
  <form method="post">{% csrf_token %}{% include 'budget/components/form_fields.html' %}
    <button class="primary" type="submit">Send recovery email</button>
  </form>
  <a class="secondary mt-4" href="{% url 'login' %}">Back to sign in</a>
</section>
{% endblock %}
